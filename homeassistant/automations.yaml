- id: seikatsu_nag_status
  alias: 生活リマインダー状態更新
  description: GitHub Actionsから未完了状態を受け取る
  triggers:
    - trigger: webhook
      webhook_id: !secret seikatsu_nag_webhook_id
      allowed_methods:
        - POST
      local_only: false
  conditions: []
  actions:
    - action: input_text.set_value
      target:
        entity_id: input_text.seikatsu_nag_status
      data:
        value: "{{ trigger.json.status_text | default('(不明)') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.test | default(false) | bool }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.raito
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.incomplete | default(false) | bool }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.seikatsu_nag_active
      default:
        # 催促中(作動中フラグON)から完了に切り替わった瞬間だけライトを点ける。
        # switch.raito は状態フィードバックが無い(常にunknown)ため、切替判定はフラグで行う。
        # これで完了状態が続く5分毎の再点灯・ビープ連発を防ぐ。
        - if:
            - condition: state
              entity_id: input_boolean.seikatsu_nag_active
              state: "on"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.raito
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.seikatsu_nag_active
  mode: restart

- id: seikatsu_nag_blink
  alias: 生活リマインダー ライト強制消灯
  description: 未完了中は15秒ごとにライトへ消灯命令を送る
  triggers:
    - trigger: time_pattern
      seconds: "/15"
  conditions:
    - condition: state
      entity_id: input_boolean.seikatsu_nag_active
      state: "on"
    - condition: time
      after: "21:00:00"
      before: "23:59:59"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.raito
  mode: single

- id: seikatsu_nag_midnight_reset
  alias: 生活リマインダー 深夜リセット
  description: 古い未完了状態を翌日に持ち越さない
  triggers:
    - trigger: time
      at: "00:00:00"
  conditions: []
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.seikatsu_nag_active
  mode: single
